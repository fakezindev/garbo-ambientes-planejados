name: Deploy React to GitHub Pages

on:
  push:
    branches: ["main", "master"] # Executa a mágica sempre que você der push

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: ./frontend # 🚨 Avisa que o React está nesta pasta
        run: npm install

      - name: Build
        working-directory: ./frontend
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist' # 🚨 Onde o Vite gera o site compilado

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4