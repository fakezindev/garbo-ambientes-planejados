# ==========================================
# 1. BANCO DE DADOS (Supabase PostgreSQL)
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Podemos desligar o show-sql para a nuvem ficar mais rápida
spring.jpa.show-sql=false

# ==========================================================
# 2. STORAGE DE IMAGENS (CLOUDFLARE R2)
# ==========================================================
spring.cloud.aws.s3.endpoint=${S3_ENDPOINT}
spring.cloud.aws.credentials.access-key=${S3_ACCESS_KEY}
spring.cloud.aws.credentials.secret-key=${S3_SECRET_KEY}
application.bucket.name=${S3_BUCKET}
spring.cloud.aws.region.static=auto
spring.cloud.aws.s3.path-style-access-enabled=true

# ==========================================================
# 3. SEGURANÇA (JWT)
# ==========================================================
# Essa é a chave de 32 caracteres que você bem lembrou!
api.security.token.secret=${JWT_SECRET}

# ==========================================================
# 4. ADMIN PADRÃO (Seeder)
# ==========================================================
admin.default.email=${ADMIN_EMAIL}
admin.default.password=${ADMIN_PASSWORD}

# ==========================================================
# 5. FLYWAY (MIGRAÇÕES)
# ==========================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true


# A URL do seu frontend (por enquanto deixamos liberado, depois você coloca a URL da Vercel)
cors.allowed.origins=${CORS_ORIGIN:*}